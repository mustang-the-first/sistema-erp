services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      ERP_ENV: development
      ERP_DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/erp
      ERP_TEST_DATABASE_URL: postgresql+psycopg://erp:erp@db:5432/erp_test
      ERP_SECRET_KEY: dev-only-secret
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
