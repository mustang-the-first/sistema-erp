# Render Blueprint: public demo of Sistema ERP (free web service; PostgreSQL on Neon).
#
# Secrets are NOT stored here. On first deploy Render asks for the `sync: false` values:
#   ERP_DATABASE_URL   Neon connection string (postgresql://...?sslmode=require)
#   ERP_DEMO_PASSWORD  shared password of the demo accounts (>= 8 chars, shown on /login)
# ERP_SECRET_KEY is generated by Render. Without these the app refuses to start.
#
# Start: migrations -> seed_demo (no-op once the demo data exists) -> uvicorn.
# Daily data reset runs from GitHub Actions (.github/workflows/demo-reset.yml).

services:
  - type: web
    name: sistema-erp-demo
    runtime: docker
    plan: free
    region: virginia
    branch: ccr-9e0e04e9-vu4zii
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c "alembic upgrade head
      && python -m scripts.seed_demo
      && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
      --proxy-headers --forwarded-allow-ips '*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ERP_ENV
        value: production
      - key: ERP_DEMO_MODE
        value: "true"
      - key: ERP_SECRET_KEY
        generateValue: true
      - key: ERP_DATABASE_URL
        sync: false
      - key: ERP_DEMO_PASSWORD
        sync: false
