[project]
name = "sistema-erp"
version = "0.1.0"
description = "Mini-ERP with an order-to-cash flow and automatic double-entry bookkeeping (Argentina)."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121",            # >=0.121 for Depends(..., scope="function")
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1",
    "tzdata>=2024.1",  # zoneinfo data on slim images
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-repeat>=0.9",
    "httpx2>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ"]
ignore = [
    "B008",  # FastAPI Depends() in defaults
    "N818",  # domain exception names from docs/plan.md (NotFound, BusinessRuleViolation, ...)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app/core", "app/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A hang must be a failure, never an infinite wait. Concurrency tests get 60 s (conftest.py).
timeout = 30
markers = [
    "unit: pure logic, no database",
    "integration: needs PostgreSQL (ERP_TEST_DATABASE_URL)",
    "concurrency: separate connections, TRUNCATE cleanup",
    "e2e: full order-to-cash flow",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
