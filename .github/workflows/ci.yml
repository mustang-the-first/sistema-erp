name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      ERP_ENV: test
      ERP_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      ERP_TEST_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrations apply on a clean database and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Migrations downgrade to base and re-apply
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sistema-erp:ci .
