# Render Blueprint: public demo of Sistema ERP (free web service; PostgreSQL on Neon).
#
# No secret or environment-specific value lives here. On first sync Render asks for every
# `sync: false` variable (checklist and generation commands in docs/deploy.md):
#   ERP_DATABASE_URL   Neon DIRECT connection string (host without "-pooler")
#   ERP_SECRET_KEY     >= 32 random chars
#   ERP_DEMO_MODE      true
#   ERP_DEMO_PASSWORD  shared password of the demo accounts (>= 8 chars, shown on /login)
# ERP_ENV is fixed to production: with it the app refuses to start if any secret is missing.
#
# Start: the image CMD (scripts/start.sh): migrations -> seed_demo in demo mode (no-op once
# loaded) -> uvicorn on $PORT. No dockerCommand override.
# Daily data reset runs from GitHub Actions (.github/workflows/demo-reset.yml).

services:
  - type: web
    name: sistema-erp-demo
    runtime: docker
    plan: free
    region: virginia
    branch: ccr-9e0e04e9-vu4zii
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ERP_ENV
        value: production
      - key: ERP_DATABASE_URL
        sync: false
      - key: ERP_SECRET_KEY
        sync: false
      - key: ERP_DEMO_MODE
        sync: false
      - key: ERP_DEMO_PASSWORD
        sync: false
